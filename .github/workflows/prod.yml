name: Prod CI/CD Pipeline

on:
  push:
    branches:
      - Prod

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2️⃣ Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 3️⃣ Login to ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # 4️⃣ Build Docker Image for Backend
      - name: Build Backend Docker Image
        run: |
          docker build -t ${{ secrets.ECR_REPOSITORY }}:latest ./backend

      # 5️⃣ Tag Docker Image for ECR
      - name: Tag Docker Image
        run: |
          docker tag ${{ secrets.ECR_REPOSITORY }}:latest \
          ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest

      # 6️⃣ Push Docker Image to ECR
      - name: Push Docker Image to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest

      # 7️⃣ Deploy Backend + MongoDB on EC2 via SSH
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Create a Docker network if it doesn't exist
            docker network inspect my-network >/dev/null 2>&1 || docker network create my-network

            # Run MongoDB container (if not already running)
            if [ "$(docker ps -q -f name=mongo)" = "" ]; then
              docker run -d \
                --name mongo \
                --network my-network \
                -e MONGO_INITDB_DATABASE=mydb \
                mongo:6.0
            fi

            # Pull latest backend image from ECR
            docker pull ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest

            # Stop old backend container if exists
            docker stop my-app || true
            docker rm my-app || true

            # Run new backend container on the same network as MongoDB
            docker run -d \
              --name my-app \
              --network my-network \
              -p 80:5000 \
              -e MONGODB_URI="mongodb://mongo:27017/mydb" \
              ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest
