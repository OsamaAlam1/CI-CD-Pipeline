name: Prod CI/CD Pipeline

on:
  push:
    branches:
      - Prod

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2️⃣ Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 3️⃣ Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # 4️⃣ Build Backend Docker Image
      - name: Build Backend Docker Image
        run: |
          docker build -t backend:latest ./backend

      # 5️⃣ Tag Backend Docker Image for ECR
      - name: Tag Backend Docker Image
        run: |
          docker tag backend:latest ${{ steps.login-ecr.outputs.registry }}/backend:latest

      # 6️⃣ Push Backend Docker Image to ECR
      - name: Push Backend Docker Image to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/backend:latest

      # 7️⃣ Build Frontend Docker Image
      - name: Build Frontend Docker Image
        run: |
          docker build -t frontend:latest ./frontend

      # 8️⃣ Tag Frontend Docker Image for ECR
      - name: Tag Frontend Docker Image
        run: |
          docker tag frontend:latest ${{ steps.login-ecr.outputs.registry }}/frontend:latest

      # 9️⃣ Push Frontend Docker Image to ECR
      - name: Push Frontend Docker Image to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/frontend:latest

      # 🔟 Deploy Backend + MongoDB on EC2 via SSH
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Create Docker network
            docker network inspect my-network >/dev/null 2>&1 || docker network create my-network

            # Run MongoDB container if not running
            if [ "$(docker ps -q -f name=mongo)" = "" ]; then
              docker run -d \
                --name mongo \
                --network my-network \
                -e MONGO_INITDB_DATABASE=mydb \
                mongo:6.0
            fi

            # Pull latest backend image
            docker pull ${{ steps.login-ecr.outputs.registry }}/backend:latest

            # Stop old backend container if exists
            docker stop my-app || true
            docker rm my-app || true

            # Run new backend container on same network
            docker run -d \
              --name my-app \
              --network my-network \
              -p 5000:5000 \
              -e MONGO_URI="mongodb://mongo:27017/mydb" \
              ${{ steps.login-ecr.outputs.registry }}/backend:latest

            # Pull latest frontend image
            docker pull ${{ steps.login-ecr.outputs.registry }}/frontend:latest

            # Stop old frontend container if exists
            docker stop my-frontend || true
            docker rm my-frontend || true

            # Run new frontend container on same network
            docker run -d \
              --name my-frontend \
              --network my-network \
              -p 80:3000 \
              ${{ steps.login-ecr.outputs.registry }}/frontend:latest
