name: Docker CI/CD

on:
  push:
    branches:
      - Prod

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2️⃣ Login to DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3️⃣ Build Frontend Image (Dockerfile inside frontend folder)
      - name: Build Frontend Image
        run: docker build -t osamaalam1/frontend:latest ./frontend

      # 4️⃣ Build Backend Image (Dockerfile inside backend folder)
      - name: Build Backend Image
        run: docker build -t osamaalam1/backend:latest ./backend

      # 5️⃣ Push Frontend Image
      - name: Push Frontend Image
        run: docker push osamaalam1/frontend:latest

      # 6️⃣ Push Backend Image
      - name: Push Backend Image
        run: docker push osamaalam1/backend:latest
