name: Prod CI/CD Pipeline

on:
  push:
    branches:
      - Prod

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2️⃣ Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 3️⃣ Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # 4️⃣ Build Backend Docker Image
      - name: Build Backend Docker Image
        run: |
          docker build -t backend:latest ./backend
          docker tag backend:latest ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_BACKEND_REPO }}:latest

      # 5️⃣ Push Backend Docker Image to ECR
      - name: Push Backend Image to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_BACKEND_REPO }}:latest

      # 6️⃣ Build Frontend Docker Image
      - name: Build Frontend Docker Image
        run: |
          docker build -t frontend:latest ./frontend
          docker tag frontend:latest ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_FRONTEND_REPO }}:latest

      # 7️⃣ Push Frontend Docker Image to ECR
      - name: Push Frontend Image to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_FRONTEND_REPO }}:latest

      # 8️⃣ Deploy to EC2 via SSH
      - name: Deploy Backend + Frontend + MongoDB on EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Create Docker network if not exists
            docker network inspect my-network >/dev/null 2>&1 || docker network create my-network

            # Run MongoDB container if not running
            if [ "$(docker ps -q -f name=mongo)" = "" ]; then
              docker run -d \
                --name mongo \
                --network my-network \
                -e MONGO_INITDB_DATABASE=mydb \
                mongo:6.0
            fi

            # Pull latest backend image
            docker pull ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_BACKEND_REPO }}:latest

            # Stop old backend container if exists
            docker stop backend || true
            docker rm backend || true

            # Run backend container
            docker run -d \
              --name backend \
              --network my-network \
              -p 5000:5000 \
              -e MONGO_URI="mongodb://mongo:27017/mydb" \
              ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_BACKEND_REPO }}:latest

            # Pull latest frontend image
            docker pull ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_FRONTEND_REPO }}:latest

            # Stop old frontend container if exists
            docker stop frontend || true
            docker rm frontend || true

            # Run frontend container
            docker run -d \
              --name frontend \
              --network my-network \
              -p 3000:80 \
              ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_FRONTEND_REPO }}:latest
