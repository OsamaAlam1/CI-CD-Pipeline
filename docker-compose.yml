version: "3.9"

services:
  frontend:
    build: ./frontend 
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
        - VITE_API_URL=http://backend:5000
  backend:
    build: ./backend 
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/mydb
    depends_on:
      - mongo
  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
volumes:  
  mongo-data: